// ── SUPABASE ─────────────────────────────────────────────────
const mkSupa = (url, key, tok) => {
  const h = (x={}) => ({'apikey':key,'Authorization':`Bearer ${tok||key}`,'Content-Type':'application/json',...x});
  const get = (t,q='') => fetch(`${url}/rest/v1/${t}?${q}`,{headers:h()}).then(r=>r.json());
  const post = (t,b,pref='return=representation,resolution=merge-duplicates') =>
    fetch(`${url}/rest/v1/${t}`,{method:'POST',headers:h({'Prefer':pref}),body:JSON.stringify(b)}).then(r=>r.json());
  const patch = (t,m,b) => {
    const q=Object.entries(m).map(([k,v])=>`${k}=eq.${encodeURIComponent(v)}`).join('&');
    return fetch(`${url}/rest/v1/${t}?${q}`,{method:'PATCH',headers:h({'Prefer':'return=minimal'}),body:JSON.stringify(b)});
  };
  const auth = (p,b) => fetch(`${url}/auth/v1/${p}`,{method:'POST',headers:{'apikey':key,'Content-Type':'application/json'},body:JSON.stringify(b)})
    .then(async r=>{const d=await r.json();if(!r.ok)throw d;return d;});
  return {get,post,patch,signUp:(e,p)=>auth('signup',{email:e,password:p}),signIn:(e,p)=>auth('token?grant_type=password',{email:e,password:p})};
};

// ── TEAMS ────────────────────────────────────────────────────
const GROUPS = {
  'Grupo A':[{id:'MEX',n:'México',f:'🇲🇽'},{id:'RSA',n:'Sudáfrica',f:'🇿🇦'},{id:'KOR',n:'Corea del Sur',f:'🇰🇷'},{id:'CZE',n:'Rep. Checa',f:'🇨🇿'}],

  'Grupo H':[{id:'ESP',n:'España',f:'🇪🇸'},{id:'CPV',n:'Cabo Verde',f:'🇨🇻'},{id:'SAU',n:'Arabia Saudita',f:'🇸🇦'},{id:'URU',n:'Uruguay',f:'🇺🇾'}],
  'Grupo I':[{id:'FRA',n:'Francia',f:'🇫🇷'},{id:'SEN',n:'Senegal',f:'🇸🇳'},{id:'IRQ',n:'Irak',f:'🇮🇶'},{id:'NOR',n:'Noruega',f:'🇳🇴'}],
  'Grupo J':[{id:'ARG',n:'Argentina',f:'🇦🇷'},{id:'ALG',n:'Argelia',f:'🇩🇿'},{id:'AUT',n:'Austria',f:'🇦🇹'},{id:'JOR',n:'Jordania',f:'🇯🇴'}],
  'Grupo K':[{id:'POR',n:'Portugal',f:'🇵🇹'},{id:'COD',n:'R.D. Congo',f:'🇨🇩'},{id:'UZB',n:'Uzbekistán',f:'🇺🇿'},{id:'COL',n:'Colombia',f:'🇨🇴'}],

const ALL_T = Object.values(GROUPS).flat();
const TM = {};
ALL_T.forEach(t=>{TM[t.id]=t;});
const OFB = {'Mexico':'MEX','South Africa':'RSA','South Korea':'KOR','Czech Republic':'CZE','Canada':'CAN','Bosnia & Herzegovina':'BIH','Bosnia-Herzegovina':'BIH','Qatar':'QAT','Switzerland':'SUI','Brazil':'BRA','Morocco':'MAR','Haiti':'HAI','Scotland':'SCO','USA':'USA','Paraguay':'PAR','Australia':'AUS','Turkey':'TUR','Germany':'GER','Curaçao':'CUW','Ivory Coast':'CIV','Ecuador':'ECU','Netherlands':'NED','Japan':'JPN','Sweden':'SWE','Tunisia':'TUN','Belgium':'BEL','Egypt':'EGY','Iran':'IRN','New Zealand':'NZL','Spain':'ESP','Cape Verde':'CPV','Saudi Arabia':'SAU','Uruguay':'URU','France':'FRA','Senegal':'SEN','Iraq':'IRQ','Norway':'NOR','Argentina':'ARG','Algeria':'ALG','Austria':'AUT','Jordan':'JOR','Portugal':'POR','DR Congo':'COD','Uzbekistan':'UZB','Colombia':'COL','England':'ENG','Croatia':'CRO','Ghana':'GHA','Panama':'PAN'};

// ── OFB FETCH ────────────────────────────────────────────────
const OFB_URL = 'https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json';
const PROXIES = [u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,u=>`https://corsproxy.io/?${encodeURIComponent(u)}`];
const fetchOFB = async () => {
  for(const px of PROXIES){
    try{const r=await fetch(px(OFB_URL),{signal:AbortSignal.timeout(8000)});if(!r.ok)continue;return await r.json();}catch{continue;}
  }
  return null;
};
const parseOFB = data => {
  if(!data||!data.matches) return [];
  return data.matches.map((m,i)=>{
    const tp=(m.time||'00:00 UTC+0').split(' ');
    const [hh,mm]=tp[0].split(':').map(Number);
    const tz=parseInt((tp[1]||'UTC+0').replace('UTC',''))||0;
    const d=new Date(`${m.date}T${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:00Z`);
    d.setHours(d.getHours()-tz);
    const grp=m.group?`Grupo ${m.group.replace('Group ','')}`:null;
    const sc=m.score?.ft;
    return {id:`ofb_${i}`,home_team:OFB[m.team1]||m.team1,away_team:OFB[m.team2]||m.team2,kickoff_utc:d.toISOString(),stage:grp?'group':(m.round||'knockout'),group_name:grp,home_goals:sc?sc[0]:null,away_goals:sc?sc[1]:null,source:'openfootball'};
  });
};

// ── HELPERS ──────────────────────────────────────────────────
const locked = ko => (new Date(ko)-new Date())<3600000;
const pts = (ph,pa,rh,ra) => { if(rh===null||ra===null||ph===null||pa===null) return null; if(ph===rh&&pa===ra) return 3; const pr=ph>pa?1:ph<pa?-1:0,rr=rh>ra?1:rh<ra?-1:0; return pr===rr?1:0; };
const fmtD = dt => { if(!dt) return ''; const d=new Date(dt); return d.toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short'})+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}); };
const cdown = ko => { const d=new Date(ko)-new Date(); if(d<=0) return null; if(d<3600000) return `Cierra en ${Math.floor(d/60000)}m`; const h=Math.floor(d/3600000); return h<24?`Cierra en ${h}h`:`${Math.floor(h/24)}d`; };

// ── AUTH ─────────────────────────────────────────────────────
function AuthScreen({supa,onLogin}) {
  const [mode,setMode]=useState('login');
  const [email,setEmail]=useState('');const [pass,setPass]=useState('');const [name,setName]=useState('');
  const [load,setLoad]=useState(false);const [err,setErr]=useState('');const [msg,setMsg]=useState('');
  const go = async()=>{
    setErr('');setMsg('');
    if(!email||!pass){setErr('Completá todos los campos');return;}
    setLoad(true);
    try{
      if(mode==='register'){
        const d=await supa.signUp(email,pass);
        if(d.user){try{await supa.post('profiles',{id:d.user.id,email,display_name:name||email.split('@')[0]},'return=minimal,resolution=ignore-duplicates');}catch{}}
        setMsg('¡Registrado! Revisá tu email para confirmar, luego ingresá.');
      }else{
        const d=await supa.signIn(email,pass);onLogin(d);
      }
    }catch(e){setErr(e?.error_description||e?.message||'Error');}
    setLoad(false);
  };
  return (
    <div className="auth-wrap">
      <div className="auth-box">
        <div className="auth-logo">⚽ PRODE</div>
        <div className="auth-sub">MUNDIAL 2026 — ENTRE AMIGOS</div>
        <div className="atog">
          <button className={`atog-btn ${mode==='login'?'on':''}`} onClick={()=>setMode('login')}>Ingresar</button>
          <button className={`atog-btn ${mode==='register'?'on':''}`} onClick={()=>setMode('register')}>Registrarse</button>
        </div>
        {err&&<div className="err">{err}</div>}
        {msg&&<div className="ok">{msg}</div>}
        {mode==='register'&&<div className="field"><label>Tu nombre</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="Como querés aparecer en la tabla"/></div>}
        <div className="field"><label>Email</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="vos@email.com" onKeyDown={e=>e.key==='Enter'&&go()}/></div>
        <div className="field"><label>Contraseña</label><input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==='Enter'&&go()}/></div>
        <button className="btn-p" onClick={go} disabled={load}>{load?'Procesando...':(mode==='login'?'Ingresar':'Crear cuenta')}</button>

// ── TABLA ────────────────────────────────────────────────────
function Tabla({supa,ses}) {
  const [rows,setRows]=useState([]);const [load,setLoad]=useState(true);const uid=ses.user?.id;
  useEffect(()=>{
    const go=async()=>{
      setLoad(true);
      const [profiles,matches,allP]=await Promise.all([supa.get('profiles','select=*'),supa.get('matches','select=*'),supa.get('predictions','select=*')]);
      const mm={};if(Array.isArray(matches))matches.forEach(m=>mm[m.id]=m);
      const lb=(Array.isArray(profiles)?profiles:[]).map(pr=>{
        const up=(Array.isArray(allP)?allP:[]).filter(p=>p.user_id===pr.id);
        let p=0,ex=0;
        up.forEach(pred=>{const m=mm[pred.match_id];if(!m)return;const v=pts(pred.home_goals,pred.away_goals,m.home_goals,m.away_goals);if(v===3){p+=3;ex++;}else if(v===1){p+=1;}});
        return {...pr,pts:p,exact:ex,preds:up.length};
      }).sort((a,b)=>b.pts-a.pts||b.exact-a.exact);
      setRows(lb);setLoad(false);
    };go();
  },[]);
  if(load) return <div className="loading"><div className="spin"/><p>Calculando...</p></div>;
  return (
    <div>
      <div className="stitle">TABLA DE POSICIONES</div>
      <div className="ssub">{rows.length} participantes</div>
      {rows.length===0&&<div className="empty">Todavía no hay participantes.</div>}
      <div className="lb">
        {rows.map((r,i)=>{
          const isMe=r.id===uid;const pc=i===0?'t1':i===1?'t2':i===2?'t3':'';
          return (
            <div key={r.id} className={`lbrow ${isMe?'me':''}`}>
              <div className={`lbpos ${pc}`}>{i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div>
              <div className={`lbname ${isMe?'me':''}`}>{r.display_name||r.email?.split('@')[0]}{isMe&&<span style={{fontSize:11,color:'var(--gr)',marginLeft:6}}>(vos)</span>}</div>
              <div className="lbdet"><div>{r.preds} pred.</div><div>{r.exact}⭐</div></div>
              <div className="lbpts">{r.pts}<div className="lbptsl">pts</div></div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── ADMIN ────────────────────────────────────────────────────
function Admin({supa,ses,cfg,upCfg}) {
  const [matches,setMatches]=useState([]);
  const [status,setStatus]=useState('');
  const [load,setLoad]=useState(false);
  const [editing,setEditing]=useState(null);
  const [adminEmail,setAdminEmail]=useState(cfg.adminEmail||ses.user?.email||'');
  useEffect(()=>{supa.get('matches','select=*&order=kickoff_utc.asc').then(m=>setMatches(Array.isArray(m)?m:[]));},[]); 
  const sync=async()=>{
    setLoad(true);setStatus('Conectando a openfootball (GitHub)...');
    const data=await fetchOFB();
    if(!data){setStatus('❌ No se pudo conectar. Intentá de nuevo.');setLoad(false);return;}
    const rows=parseOFB(data);setStatus(`Guardando ${rows.length} partidos...`);
    let ok=0;
    for(let i=0;i<rows.length;i+=25){
      const b=rows.slice(i,i+25);
      await supa.post('matches',b,'return=minimal,resolution=merge-duplicates');
      ok+=b.length;setStatus(`Guardando... ${ok}/${rows.length}`);
    }
    const up=await supa.get('matches','select=*&order=kickoff_utc.asc');
    setMatches(Array.isArray(up)?up:[]);
    setStatus(`✅ ${ok} partidos sincronizados`);setLoad(false);
  };
  const saveRes=async(id,hg,ag)=>{
    await supa.patch('matches',{id},{home_goals:parseInt(hg),away_goals:parseInt(ag)});
    setMatches(prev=>prev.map(m=>m.id===id?{...m,home_goals:parseInt(hg),away_goals:parseInt(ag)}:m));
    setEditing(null);
  };
  return (
    <div>
      <div className="stitle">PANEL ADMIN</div>
      <div className="ssub">Solo visible para el administrador</div>
      <div className="cfg-card">
        <div className="cfg-title">👤 Email de administrador</div>
        <div className="cfg-desc">Tu email para acceder al panel Admin desde cualquier dispositivo.</div>
        <div style={{display:'flex',gap:10}}>
          <input className="cfg-input" value={adminEmail} onChange={e=>setAdminEmail(e.target.value)} placeholder="tu@email.com"/>
          <button className="btn-sm" onClick={()=>upCfg({...cfg,adminEmail:adminEmail.trim()})}>Guardar</button>
        </div>
        {cfg.adminEmail&&<p style={{fontSize:11,color:'var(--gr)',marginTop:8}}>Guardado: <strong style={{color:'var(--gb)'}}>{cfg.adminEmail}</strong></p>}
      </div>
      <div className="cfg-card">
        <div className="cfg-title">🔄 Sincronizar desde openfootball</div>
        <div className="cfg-desc">Trae los 104 partidos del Mundial 2026 desde GitHub, sin API key. También actualiza resultados.</div>
        {status&&<div className={status.startsWith('✅')?'ok':'err'} style={{marginBottom:12}}>{status}</div>}
        <button className="btn-sm" onClick={sync} disabled={load}>{load?'Sincronizando...':'⬇ Sincronizar partidos y resultados'}</button>
      </div>
      <div className="cfg-card">
        <div className="cfg-title">✏️ Resultados manuales</div>
        <div className="cfg-desc">{matches.length} partidos en la base de datos.</div>
        {matches.map(m=>{
          const hm=getTeam(m.home_team),aw=getTeam(m.away_team);const isEd=editing===m.id;
          return (
            <div key={m.id} style={{display:'flex',alignItems:'center',gap:8,marginBottom:10,flexWrap:'wrap',paddingBottom:10,borderBottom:'1px solid rgba(76,175,80,.07)'}}>
              <span style={{flex:1,fontSize:13,minWidth:180}}>{hm.f} {hm.n} vs {aw.f} {aw.n}<span style={{fontSize:11,color:'var(--gr)',display:'block',marginTop:2}}>{fmtD(m.kickoff_utc)}</span></span>
              {isEd
                ? <ResEdit m={m} onSave={saveRes} onCancel={()=>setEditing(null)}/>
                : <div style={{display:'flex',alignItems:'center',gap:8}}>
                    {m.home_goals!==null?<span style={{fontFamily:"'Bebas Neue'",color:'var(--gold)',fontSize:18}}>{m.home_goals} - {m.away_goals}</span>:<span style={{fontSize:12,color:'var(--gr)'}}>Sin resultado</span>}
                    <button className="btn-sm" style={{padding:'4px 10px',fontSize:11}} onClick={()=>setEditing(m.id)}>{m.home_goals!==null?'Editar':'+ Resultado'}</button>
                  </div>
              }
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ResEdit({m,onSave,onCancel}) {
  const [hg,setHg]=useState(m.home_goals??'');const [ag,setAg]=useState(m.away_goals??'');
  return (
    <div style={{display:'flex',gap:6,alignItems:'center'}}>
      <input className="si" style={{width:44,height:36,fontSize:18}} type="number" min="0" value={hg} onChange={e=>setHg(e.target.value)}/>
      <span style={{color:'var(--gr)'}}>-</span>
      <input className="si" style={{width:44,height:36,fontSize:18}} type="number" min="0" value={ag} onChange={e=>setAg(e.target.value)}/>
      <button className="btn-sm" style={{padding:'4px 10px',fontSize:11}} onClick={()=>onSave(m.id,hg,ag)}>✓</button>
      <button className="btn-c" style={{padding:'4px 8px',fontSize:11}} onClick={onCancel}>✗</button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
