<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prode Mundial 2026</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--gd:#0a1f0e;--gm:#1a3d20;--gf:#2d6a35;--gb:#4caf50;--gold:#f0b429;--gl:#ffd166;--w:#f8f9f0;--gr:#8a9b8e;--red:#e84040}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--gd);color:var(--w);font-family:'DM Sans',sans-serif;min-height:100vh;background-image:radial-gradient(ellipse at 20% 20%,rgba(45,106,53,.3) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(240,180,41,.08) 0%,transparent 50%)}
.hdr{background:rgba(10,31,14,.95);border-bottom:1px solid rgba(76,175,80,.2);padding:0 24px;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
.hdr-i{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--gold)}
.logo span{color:var(--w)}
.uinfo{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--gr)}
.uname{color:var(--w);font-weight:500}
.btn-out{background:none;border:1px solid rgba(138,155,142,.3);color:var(--gr);padding:4px 12px;border-radius:20px;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;transition:all .2s}
.btn-out:hover{border-color:var(--red);color:var(--red)}
.nav{background:rgba(10,31,14,.8);border-bottom:1px solid rgba(76,175,80,.1);position:sticky;top:60px;z-index:99}
.nav-i{max-width:900px;margin:0 auto;display:flex}
.ntab{padding:14px 22px;font-size:13px;font-weight:500;color:var(--gr);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif}
.ntab:hover{color:var(--w)}
.ntab.on{color:var(--gold);border-bottom-color:var(--gold)}
.main{max-width:900px;margin:0 auto;padding:24px}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-box{width:100%;max-width:420px;background:rgba(26,61,32,.4);border:1px solid rgba(76,175,80,.2);border-radius:20px;padding:40px;backdrop-filter:blur(20px)}
.auth-logo{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:3px;color:var(--gold);text-align:center;line-height:1;margin-bottom:4px}
.auth-sub{text-align:center;color:var(--gr);font-size:13px;margin-bottom:32px;letter-spacing:1px}
.atog{display:flex;background:rgba(10,31,14,.5);border-radius:10px;padding:4px;margin-bottom:24px}
.atog-btn{flex:1;padding:8px;background:none;border:none;color:var(--gr);font-size:13px;font-weight:500;cursor:pointer;border-radius:7px;transition:all .2s;font-family:'DM Sans',sans-serif}
.atog-btn.on{background:var(--gf);color:var(--w)}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--gr);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}
.field input{width:100%;background:rgba(10,31,14,.6);border:1px solid rgba(76,175,80,.2);border-radius:10px;padding:12px 16px;color:var(--w);font-size:15px;font-family:'DM Sans',sans-serif;transition:border-color .2s;outline:none}
.field input:focus{border-color:var(--gb)}
.field input::placeholder{color:rgba(138,155,142,.5)}
.btn-p{width:100%;background:var(--gold);color:#0a1f0e;border:none;padding:14px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;margin-top:8px}
.btn-p:hover{background:var(--gl);transform:translateY(-1px)}
.btn-p:disabled{opacity:.5;cursor:not-allowed;transform:none}
.err{background:rgba(232,64,64,.15);border:1px solid rgba(232,64,64,.3);color:#ff8080;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px}
.ok{background:rgba(76,175,80,.15);border:1px solid rgba(76,175,80,.3);color:#80e085;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px}
.stitle{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--gold);margin-bottom:4px}
.ssub{font-size:13px;color:var(--gr);margin-bottom:20px}
.mcard{background:rgba(26,61,32,.3);border:1px solid rgba(76,175,80,.12);border-radius:16px;padding:18px 20px;margin-bottom:10px;transition:all .2s;cursor:pointer}
.mcard:hover{border-color:rgba(76,175,80,.3);background:rgba(26,61,32,.45)}
.mcard.locked{opacity:.75;cursor:default}
.mcard.locked:hover{border-color:rgba(76,175,80,.12);background:rgba(26,61,32,.3)}
.mcard.res{border-color:rgba(240,180,41,.15)}
.mtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:6px}
.mmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.bg{background:rgba(76,175,80,.15);color:var(--gb)}
.bko{background:rgba(240,180,41,.15);color:var(--gold)}
.bl{background:rgba(232,64,64,.15);color:#ff8080}
.bo{background:rgba(76,175,80,.15);color:var(--gb)}
.bd{background:rgba(240,180,41,.15);color:var(--gold)}
.mdate{font-size:12px;color:var(--gr)}
.mteams{display:flex;align-items:center;justify-content:space-between;gap:12px}
.team{flex:1;display:flex;align-items:center;gap:10px}
.team.away{flex-direction:row-reverse;text-align:right}
.tflag{font-size:26px;line-height:1}
.tname{font-size:14px;font-weight:500}
.mvs{text-align:center;min-width:80px}
.score-r{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--gold)}
.vs-t{font-size:13px;color:var(--gr);font-weight:300}
.prow{margin-top:12px;padding-top:12px;border-top:1px solid rgba(76,175,80,.1);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.plabel{font-size:12px;color:var(--gr)}
.pval{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.pbadge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.p3{background:rgba(240,180,41,.2);color:var(--gold)}
.p1{background:rgba(76,175,80,.2);color:var(--gb)}
.p0{background:rgba(232,64,64,.1);color:var(--gr)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200;padding:24px;backdrop-filter:blur(4px)}
.modal{background:var(--gd);border:1px solid rgba(76,175,80,.25);border-radius:24px;padding:32px;width:100%;max-width:420px}
.mtitle{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--gold);margin-bottom:20px}
.mteams2{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding:16px;background:rgba(26,61,32,.4);border-radius:12px}
.mt2{text-align:center;flex:1}
.mt2-flag{font-size:36px}
.mt2-name{font-size:13px;color:var(--gr);margin-top:4px}
.sinputs{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:24px}
.siwrap{text-align:center}
.silabel{font-size:11px;color:var(--gr);margin-bottom:6px;display:block}
.si{width:64px;height:64px;background:rgba(10,31,14,.6);border:2px solid rgba(76,175,80,.3);border-radius:12px;color:var(--w);font-size:28px;font-family:'Bebas Neue',sans-serif;text-align:center;outline:none;transition:border-color .2s}
.si:focus{border-color:var(--gold)}
.sdash{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--gr)}
.mactions{display:flex;gap:10px}
.btn-c{flex:1;background:none;border:1px solid rgba(138,155,142,.3);color:var(--gr);padding:12px;border-radius:12px;font-size:14px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.btn-c:hover{border-color:var(--gr);color:var(--w)}
.btn-s{flex:2;background:var(--gold);color:#0a1f0e;border:none;padding:12px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.btn-s:hover{background:var(--gl)}
.btn-s:disabled{opacity:.4;cursor:not-allowed}
.lb{background:rgba(26,61,32,.2);border:1px solid rgba(76,175,80,.12);border-radius:16px;overflow:hidden}
.lbrow{display:flex;align-items:center;padding:14px 20px;border-bottom:1px solid rgba(76,175,80,.07);transition:background .15s}
.lbrow:hover{background:rgba(76,175,80,.05)}
.lbrow:last-child{border-bottom:none}
.lbrow.me{background:rgba(240,180,41,.07)}
.lbpos{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--gr);width:44px}
.lbpos.t1{color:#ffd700}.lbpos.t2{color:#c0c0c0}.lbpos.t3{color:#cd7f32}
.lbname{flex:1;font-size:15px;font-weight:500}
.lbname.me{color:var(--gold)}
.lbpts{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--w);min-width:50px;text-align:right}
.lbptsl{font-size:11px;color:var(--gr)}
.lbdet{font-size:12px;color:var(--gr);margin-left:16px;text-align:right;line-height:1.6}
.pod-card{background:rgba(240,180,41,.05);border:1px solid rgba(240,180,41,.2);border-radius:16px;padding:24px;margin-bottom:20px}
.pod-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;color:var(--gold);margin-bottom:4px}
.pod-sub{font-size:12px;color:var(--gr);margin-bottom:20px}
.pod-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pod-lbl{font-size:13px;color:var(--gr);width:100px;flex-shrink:0}
.pod-sel{flex:1;background:rgba(10,31,14,.6);border:1px solid rgba(76,175,80,.2);border-radius:10px;padding:10px 14px;color:var(--w);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;cursor:pointer;transition:border-color .2s;-webkit-appearance:none;appearance:none}
.pod-sel:focus{border-color:var(--gold)}
.pod-sel option,.pod-sel optgroup{background:#0a1f0e}
.btn-pod{background:var(--gold);color:#0a1f0e;border:none;padding:10px 24px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;margin-top:8px}
.btn-pod:hover{background:var(--gl)}
.btn-pod:disabled{opacity:.4;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{background:rgba(26,61,32,.3);border:1px solid rgba(76,175,80,.12);border-radius:14px;padding:16px;text-align:center}
.statv{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--gold);line-height:1}
.statl{font-size:11px;color:var(--gr);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.gfilt{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.gbtn{padding:5px 14px;background:rgba(26,61,32,.3);border:1px solid rgba(76,175,80,.15);border-radius:20px;color:var(--gr);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif}
.gbtn.on{background:var(--gf);border-color:var(--gb);color:var(--w)}
.gbtn:hover:not(.on){border-color:rgba(76,175,80,.35);color:var(--w)}
.cfg-card{background:rgba(26,61,32,.3);border:1px solid rgba(76,175,80,.15);border-radius:16px;padding:20px;margin-bottom:16px}
.cfg-title{font-size:14px;font-weight:600;margin-bottom:4px}
.cfg-desc{font-size:12px;color:var(--gr);margin-bottom:16px;line-height:1.6}
.btn-sm{background:var(--gf);color:var(--w);border:none;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;transition:all .2s}
.btn-sm:hover{background:var(--gb)}
.btn-sm:disabled{opacity:.5;cursor:not-allowed}
.cfg-input{background:rgba(10,31,14,.6);border:1px solid rgba(76,175,80,.2);border-radius:10px;padding:10px 14px;color:var(--w);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;width:100%}
.loading{text-align:center;padding:60px 20px;color:var(--gr)}
.spin{width:40px;height:40px;border:3px solid rgba(76,175,80,.2);border-top-color:var(--gb);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:var(--gr)}
.info{background:rgba(76,175,80,.08);border:1px solid rgba(76,175,80,.2);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--gr);margin-bottom:16px}
@media(max-width:600px){.main{padding:16px}.ntab{padding:12px 12px;font-size:12px}.tname{font-size:13px}.tflag{font-size:22px}}
</style>
</head>
