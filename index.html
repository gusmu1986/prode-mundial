<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prode Mundial 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green-deep: #0a1f0e;
    --green-mid: #1a3d20;
    --green-field: #2d6a35;
    --green-bright: #4caf50;
    --gold: #f0b429;
    --gold-light: #ffd166;
    --white: #f8f9f0;
    --gray: #8a9b8e;
    --red: #e84040;
    --bg: #0a1f0e;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(45,106,53,0.3) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(240,180,41,0.08) 0%, transparent 50%);
  }

  /* HEADER */
  .header {
    background: rgba(10,31,14,0.95);
    border-bottom: 1px solid rgba(76,175,80,0.2);
    padding: 0 24px;
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(12px);
  }
  .header-inner {
    max-width: 900px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    height: 60px;
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 2px;
    color: var(--gold);
    line-height: 1;
  }
  .logo span { color: var(--white); }
  .user-info {
    display: flex; align-items: center; gap: 12px;
    font-size: 13px; color: var(--gray);
  }
  .user-name { color: var(--white); font-weight: 500; }
  .btn-logout {
    background: none; border: 1px solid rgba(138,155,142,0.3);
    color: var(--gray); padding: 4px 12px; border-radius: 20px;
    cursor: pointer; font-size: 12px; transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .btn-logout:hover { border-color: var(--red); color: var(--red); }

  /* NAV */
  .nav {
    background: rgba(10,31,14,0.8);
    border-bottom: 1px solid rgba(76,175,80,0.1);
    position: sticky; top: 60px; z-index: 99;
  }
  .nav-inner {
    max-width: 900px; margin: 0 auto;
    display: flex; gap: 0;
  }
  .nav-tab {
    padding: 14px 24px;
    font-size: 13px; font-weight: 500;
    color: var(--gray);
    background: none; border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer; transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
    letter-spacing: 0.5px;
  }
  .nav-tab:hover { color: var(--white); }
  .nav-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

  /* MAIN */
  .main { max-width: 900px; margin: 0 auto; padding: 24px; }

  /* AUTH SCREEN */
  .auth-screen {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .auth-card {
    width: 100%; max-width: 420px;
    background: rgba(26,61,32,0.4);
    border: 1px solid rgba(76,175,80,0.2);
    border-radius: 20px;
    padding: 40px;
    backdrop-filter: blur(20px);
  }
  .auth-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    letter-spacing: 3px;
    color: var(--gold);
    text-align: center;
    line-height: 1;
    margin-bottom: 4px;
  }
  .auth-sub {
    text-align: center;
    color: var(--gray);
    font-size: 13px;
    margin-bottom: 32px;
    letter-spacing: 1px;
  }
  .auth-toggle {
    display: flex;
    background: rgba(10,31,14,0.5);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 24px;
  }
  .auth-toggle-btn {
    flex: 1; padding: 8px;
    background: none; border: none;
    color: var(--gray); font-size: 13px; font-weight: 500;
    cursor: pointer; border-radius: 7px; transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .auth-toggle-btn.active {
    background: var(--green-field);
    color: var(--white);
  }
  .field {
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    font-size: 12px; font-weight: 600;
    color: var(--gray);
    margin-bottom: 6px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .field input {
    width: 100%;
    background: rgba(10,31,14,0.6);
    border: 1px solid rgba(76,175,80,0.2);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--white);
    font-size: 15px;
    font-family: 'DM Sans', sans-serif;
    transition: border-color 0.2s;
    outline: none;
  }
  .field input:focus { border-color: var(--green-bright); }
  .field input::placeholder { color: rgba(138,155,142,0.5); }
  .btn-primary {
    width: 100%;
    background: var(--gold);
    color: #0a1f0e;
    border: none;
    padding: 14px;
    border-radius: 12px;
    font-size: 15px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
    margin-top: 8px;
  }
  .btn-primary:hover { background: var(--gold-light); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .msg-error {
    background: rgba(232,64,64,0.15);
    border: 1px solid rgba(232,64,64,0.3);
    color: #ff8080;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .msg-success {
    background: rgba(76,175,80,0.15);
    border: 1px solid rgba(76,175,80,0.3);
    color: #80e085;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;

  /* SECTION TITLE */
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 2px;

    margin-bottom: 4px;
  }
  .section-sub {
    font-size: 13px; color: var(--gray);
    margin-bottom: 20px;
  }

  /* MATCH CARD */
  .match-card {
    background: rgba(26,61,32,0.3);
    border: 1px solid rgba(76,175,80,0.12);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 10px;
    transition: all 0.2s;
    cursor: pointer;
  }
  .match-card:hover { border-color: rgba(76,175,80,0.3); background: rgba(26,61,32,0.45); }
  .match-card.locked { opacity: 0.7; cursor: default; }
  .match-card.has-result { border-color: rgba(240,180,41,0.15); }
  .match-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .match-meta {
    display: flex; align-items: center; gap: 8px;
  }
  .badge {
    font-size: 10px; font-weight: 600;
    padding: 3px 8px; border-radius: 20px;
    letter-spacing: 0.5px; text-transform: uppercase;
  }
  .badge-group { background: rgba(76,175,80,0.15); color: var(--green-bright); }
  .badge-ko { background: rgba(240,180,41,0.15); color: var(--gold); }
  .badge-locked { background: rgba(232,64,64,0.15); color: #ff8080; }
  .badge-open { background: rgba(76,175,80,0.15); color: var(--green-bright); }
  .badge-done { background: rgba(240,180,41,0.15); color: var(--gold); }
  .match-date { font-size: 12px; color: var(--gray); }
  .match-teams {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .team {
    flex: 1;
    display: flex; align-items: center; gap: 10px;
  }
  .team.away { flex-direction: row-reverse; text-align: right; }
  .team-flag { font-size: 28px; line-height: 1; }
  .team-name { font-size: 15px; font-weight: 500; }
  .match-vs {
    text-align: center; min-width: 80px;
  }
  .score-real {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px; letter-spacing: 2px;
    color: var(--gold);
  }
  .vs-text {
    font-size: 13px; color: var(--gray);
    font-weight: 300;
  }
  .prediction-row {
    margin-top: 12px;

  .pred-label { font-size: 12px; color: var(--gray); }
  .pred-value {
    font-size: 13px; font-weight: 600;

  .pred-score { color: var(--white); }
  .pts-badge {

  /* PREDICTION MODAL */

    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;

    backdrop-filter: blur(4px);

  .modal {
    background: var(--green-deep);
    border: 1px solid rgba(76,175,80,0.25);
    border-radius: 24px;
    padding: 32px;

  .modal-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px; letter-spacing: 2px;
    color: var(--gold); margin-bottom: 20px;
  }
  .modal-teams {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px;
    padding: 16px;
    background: rgba(26,61,32,0.4);
    border-radius: 12px;

  .modal-team { text-align: center; flex: 1; }
  .modal-team-flag { font-size: 36px; }
  .modal-team-name { font-size: 13px; color: var(--gray); margin-top: 4px; }
  .score-inputs {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; margin-bottom: 24px;
  }
  .score-input-wrap { text-align: center; }
  .score-input-label { font-size: 11px; color: var(--gray); margin-bottom: 6px; display: block; }
  .score-input {
    width: 64px; height: 64px;
    background: rgba(10,31,14,0.6);
    border: 2px solid rgba(76,175,80,0.3);
    border-radius: 12px;
    color: var(--white);
    font-size: 28px; font-family: 'Bebas Neue', sans-serif;
    text-align: center; outline: none;
    transition: border-color 0.2s;
  }
  .score-input:focus { border-color: var(--gold); }
  .score-dash {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px; color: var(--gray);
  }
  .modal-actions {
    display: flex; gap: 10px;
  }
  .btn-cancel {
    flex: 1;
    background: none;
    border: 1px solid rgba(138,155,142,0.3);
    color: var(--gray); padding: 12px;
    border-radius: 12px; font-size: 14px;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
    transition: all 0.2s;
  }
  .btn-cancel:hover { border-color: var(--gray); color: var(--white); }
  .btn-save {
    flex: 2;
    background: var(--gold);
    color: #0a1f0e; border: none;
    padding: 12px; border-radius: 12px;
    font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
    transition: all 0.2s;
  }
  .btn-save:hover { background: var(--gold-light); }
  .btn-save:disabled { opacity: 0.4; cursor: not-allowed; }

  /* LEADERBOARD */
  .leaderboard {
    background: rgba(26,61,32,0.2);
    border: 1px solid rgba(76,175,80,0.12);
    border-radius: 16px;
    overflow: hidden;
  }
  .lb-row {
    display: flex; align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid rgba(76,175,80,0.07);
    transition: background 0.15s;
  }
  .lb-row:hover { background: rgba(76,175,80,0.05); }
  .lb-row:last-child { border-bottom: none; }
  .lb-row.me { background: rgba(240,180,41,0.07); }
  .lb-pos {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px; color: var(--gray);
    width: 40px;
  }
  .lb-pos.top1 { color: #ffd700; }
  .lb-pos.top2 { color: #c0c0c0; }
  .lb-pos.top3 { color: #cd7f32; }
  .lb-name { flex: 1; font-size: 15px; font-weight: 500; }
  .lb-name.me-name { color: var(--gold); }
  .lb-pts {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px; color: var(--white);

  .lb-pts-label { font-size: 11px; color: var(--gray); }
  .lb-detail { font-size: 12px; color: var(--gray); margin-left: 16px; text-align: right; }

  /* PODIO CARD */
  .podio-card {
    background: rgba(240,180,41,0.05);
    border: 1px solid rgba(240,180,41,0.2);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;

  .podio-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px; letter-spacing: 2px;
    color: var(--gold); margin-bottom: 4px;
  }
  .podio-sub { font-size: 12px; color: var(--gray); margin-bottom: 20px; }
  .podio-row {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 12px;
  }
  .podio-label {
    font-size: 13px; color: var(--gray);
    width: 80px; flex-shrink: 0;
  }
  .podio-select {
    flex: 1;
    background: rgba(10,31,14,0.6);
    border: 1px solid rgba(76,175,80,0.2);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--white);
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
    appearance: none;
  }
  .podio-select:focus { border-color: var(--gold); }
  .podio-select option { background: #0a1f0e; }
  .podio-pts {
    font-size: 12px; color: var(--gold);
    font-weight: 600; white-space: nowrap;
  }
  .btn-podio-save {
    background: var(--gold); color: #0a1f0e;
    border: none; padding: 10px 24px;
    border-radius: 10px; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
    transition: all 0.2s; margin-top: 8px;

  .btn-podio-save:hover { background: var(--gold-light); }
  .btn-podio-save:disabled { opacity: 0.4; cursor: not-allowed; }

  /* STATS CARD */
  .stats-row {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 12px; margin-bottom: 20px;
  }
  .stat-card {
    background: rgba(26,61,32,0.3);
    border: 1px solid rgba(76,175,80,0.12);
    border-radius: 14px;

  }
  .stat-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px; color: var(--gold);

  .stat-label { font-size: 11px; color: var(--gray); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

  /* GRUPOS */
  .group-filter {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 16px;
  }
  .group-btn {
    padding: 5px 14px;
    background: rgba(26,61,32,0.3);
    border: 1px solid rgba(76,175,80,0.15);
    border-radius: 20px;
    color: var(--gray); font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
    font-family: 'DM Sans', sans-serif;
  }
  .group-btn.active { background: var(--green-field); border-color: var(--green-bright); color: var(--white); }
  .group-btn:hover:not(.active) { border-color: rgba(76,175,80,0.35); color: var(--white); }

  /* CONFIG PANEL */
  .config-card {
    background: rgba(26,61,32,0.3);
    border: 1px solid rgba(76,175,80,0.15);
    border-radius: 16px; padding: 20px;
    margin-bottom: 16px;
  }
  .config-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .config-desc { font-size: 12px; color: var(--gray); margin-bottom: 16px; }
  .config-field { display: flex; gap: 10px; align-items: center; }
  .config-input {
    flex: 1;
    background: rgba(10,31,14,0.6);
    border: 1px solid rgba(76,175,80,0.2);
    border-radius: 10px; padding: 10px 14px;
    color: var(--white); font-size: 14px;
    font-family: 'DM Sans', sans-serif; outline: none;
  }
  .btn-sm {
    background: var(--green-field); color: var(--white);
    border: none; padding: 10px 16px; border-radius: 10px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: 'DM Sans', sans-serif; white-space: nowrap;
    transition: all 0.2s;
  }
  .btn-sm:hover { background: var(--green-bright); }

  /* LOADING */
  .loading {
    text-align: center; padding: 60px 20px;
    color: var(--gray);
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(76,175,80,0.2);
    border-top-color: var(--green-bright);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty { text-align: center; padding: 40px 20px; color: var(--gray); }

  @media (max-width: 600px) {
    .main { padding: 16px; }
    .auth-card { padding: 28px 20px; }
    .stats-row { grid-template-columns: repeat(3, 1fr); }
    .team-name { font-size: 13px; }
    .nav-tab { padding: 12px 14px; font-size: 12px; }
  }
</style>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ============================================================
// SUPABASE CLIENT (minimal)
// ============================================================
const createSupabaseClient = (url, key) => {
  const headers = {
    'apikey': key,
    'Authorization': `Bearer ${key}`,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  };

  const req = async (path, options = {}) => {
    const r = await fetch(`${url}/rest/v1/${path}`, {
      headers: { ...headers, ...(options.headers || {}) },
      ...options
    });
    const text = await r.text();
    const data = text ? JSON.parse(text) : null;
    if (!r.ok) throw data;
    return data;
  };

  const authReq = async (path, body) => {
    const r = await fetch(`${url}/auth/v1/${path}`, {
      method: 'POST',
      headers: { 'apikey': key, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await r.json();
    if (!r.ok) throw data;
    return data;
  };

  return {
    signUp: (email, password) => authReq('signup', { email, password }),
    signIn: (email, password) => authReq('token?grant_type=password', { email, password }),
    from: (table) => ({
      select: (cols = '*') => ({
        order: (col, opts = {}) => req(`${table}?select=${cols}&order=${col}${opts.ascending ? '.asc' : '.desc'}`),
        eq: (col, val) => req(`${table}?select=${cols}&${col}=eq.${encodeURIComponent(val)}`),
        all: () => req(`${table}?select=${cols}`)
      }),
      upsert: (data, opts = {}) => req(table, {
        method: 'POST',
        headers: { 'Prefer': `return=representation,resolution=${opts.onConflict ? 'merge-duplicates' : 'ignore-duplicates'}` },
        body: JSON.stringify(data)
      }),
      update: (data, match) => {
        const q = Object.entries(match).map(([k,v]) => `${k}=eq.${v}`).join('&');
        return req(`${table}?${q}`, { method: 'PATCH', body: JSON.stringify(data) });
      },
      insert: (data) => req(table, { method: 'POST', body: JSON.stringify(data) }),
      delete: (match) => {
        const q = Object.entries(match).map(([k,v]) => `${k}=eq.${v}`).join('&');
        return req(`${table}?${q}`, { method: 'DELETE' });
      }
    })
  };
};

const isLocked = (kickoff) => {
  if (!kickoff) return false;
  return (new Date(kickoff) - new Date()) < 3600000;
};

const calcPoints = (predHome, predAway, realHome, realAway) => {
  if (realHome === null || realAway === null || predHome === null || predAway === null) return null;
  const predResult = predHome > predAway ? 1 : predHome < predAway ? -1 : 0;
  const realResult = realHome > realAway ? 1 : realHome < realAway ? -1 : 0;
  if (predHome === realHome && predAway === realAway) return 3;
  if (predResult === realResult) return 1;
  return 0;
};

const formatDate = (dt) => {
  if (!dt) return '';
  const d = new Date(dt);
  return d.toLocaleDateString('es-AR', { weekday:'short', day:'numeric', month:'short' }) +
    ' ' + d.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' });
};

const timeUntilLock = (kickoff) => {
  const diff = new Date(kickoff) - new Date();
  if (diff <= 0) return null;
  if (diff < 3600000) {
    const mins = Math.floor(diff / 60000);
    return `Cierra en ${mins}m`;
  }
  const hrs = Math.floor(diff / 3600000);
  if (hrs < 24) return `Cierra en ${hrs}h`;
  const days = Math.floor(hrs / 24);
  return `${days}d`;
};

// FETCH MATCHES FROM OPENFOOTBALL (no API key needed)
// Uses CORS proxies to access raw GitHub content
// ============================================================
const OFB_URL = 'https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json';
const CORS_PROXIES = [
  (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
];

const fetchOFBData = async () => {
  for (const proxy of CORS_PROXIES) {
    try {
      const r = await fetch(proxy(OFB_URL), { signal: AbortSignal.timeout(8000) });
      if (!r.ok) continue;
      return await r.json();
    } catch { continue; }
  }
  return null;
};

// Map openfootball team names → local team IDs
const OFB_NAME_MAP = {
  'Mexico':'MEX','South Africa':'RSA','South Korea':'KOR','Czech Republic':'CZE',
  'Canada':'CAN','Bosnia & Herzegovina':'BIH','Bosnia-Herzegovina':'BIH','Qatar':'QAT','Switzerland':'SUI',
  'Brazil':'BRA','Morocco':'MAR','Haiti':'HAI','Scotland':'SCO',
  'USA':'USA','Paraguay':'PAR','Australia':'AUS','Turkey':'TUR',
  'Germany':'GER','Curaçao':'CUW','Ivory Coast':'CIV','Ecuador':'ECU',
  'Netherlands':'NED','Japan':'JPN','Sweden':'SWE','Tunisia':'TUN',
  'Belgium':'BEL','Egypt':'EGY','Iran':'IRN','New Zealand':'NZL',
  'Spain':'ESP','Cape Verde':'CPV','Saudi Arabia':'SAU','Uruguay':'URU',
  'France':'FRA','Senegal':'SEN','Iraq':'IRQ','Norway':'NOR',
  'Argentina':'ARG','Algeria':'ALG','Austria':'AUT','Jordan':'JOR',
  'Portugal':'POR','DR Congo':'COD','Uzbekistan':'UZB','Colombia':'COL',
  'England':'ENG','Croatia':'CRO','Ghana':'GHA','Panama':'PAN',
};

const parseOFBMatches = (data) => {
  if (!data || !data.matches) return [];
  return data.matches.map((m, i) => {
    const timeParts = (m.time || '00:00 UTC+0').split(' ');
    const [hh, mm] = timeParts[0].split(':').map(Number);
    const tzOffset = parseInt((timeParts[1] || 'UTC+0').replace('UTC','')) || 0;
    const d = new Date(`${m.date}T${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:00Z`);
    d.setHours(d.getHours() - tzOffset);
    const group = m.group ? `Grupo ${m.group.replace('Group ','')}` : null;
    const score = m.score?.ft;
    const homeId = OFB_NAME_MAP[m.team1] || m.team1;
    const awayId = OFB_NAME_MAP[m.team2] || m.team2;
    return {
      id: `ofb_${i}`,
      home_team: homeId,
      away_team: awayId,
      kickoff_utc: d.toISOString(),
      stage: group ? 'group' : (m.round || 'knockout'),
      group_name: group,
      home_goals: score ? score[0] : null,
      away_goals: score ? score[1] : null,
      source: 'openfootball',
    };
  });
};

function AuthScreen({ supabase, onLogin }) {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [pass, setPass] = useState('');
  const [name, setName] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [msg, setMsg] = useState('');

  const submit = async () => {
    setError(''); setMsg('');
    if (!email || !pass) { setError('Completá todos los campos'); return; }
    setLoading(true);
    try {
      if (mode === 'register') {
        const data = await supabase.signUp(email, pass);
        // create profile
        if (data.user) {
          try {
            await supabase.from('profiles').insert({ id: data.user.id, email, display_name: name || email.split('@')[0] });
          } catch {}
        }
        setMsg('¡Registro exitoso! Revisá tu email para confirmar la cuenta, luego ingresá.');
      } else {
        const data = await supabase.signIn(email, pass);
        onLogin(data);
      }
    } catch(e) {
      setError(e?.error_description || e?.message || 'Error al procesar');
    }
    setLoading(false);
  };

  return (
    <div className="auth-screen">
      <div className="auth-card">
        <div className="auth-logo">⚽ PRODE</div>
        <div className="auth-sub">MUNDIAL 2026 — ENTRE AMIGOS</div>
        <div className="auth-toggle">
          <button className={`auth-toggle-btn ${mode==='login'?'active':''}`} onClick={() => setMode('login')}>Ingresar</button>
          <button className={`auth-toggle-btn ${mode==='register'?'active':''}`} onClick={() => setMode('register')}>Registrarse</button>
        </div>
        {error && <div className="msg-error">{error}</div>}
        {msg && <div className="msg-success">{msg}</div>}
        {mode === 'register' && (
          <div className="field">
            <label>Nombre (cómo aparecés en la tabla)</label>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="Tu nombre" />
          </div>
        )}
        <div className="field">
          <label>Email</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="vos@email.com" onKeyDown={e=>e.key==='Enter'&&submit()} />
        </div>
        <div className="field">
          <label>Contraseña</label>
          <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==='Enter'&&submit()} />
        </div>
        <button className="btn-primary" onClick={submit} disabled={loading}>
          {loading ? 'Procesando...' : mode === 'login' ? 'Ingresar' : 'Crear cuenta'}
        </button>
      </div>
    </div>
  );
}

function PartidosTab({ supabase, session, config }) {
  const [matches, setMatches] = useState([]);
  const [predictions, setPredictions] = useState({});
  const [loading, setLoading] = useState(true);
  const [selected, setSelected] = useState(null);
  const [filterGroup, setFilterGroup] = useState('ALL');

  const userId = session?.user?.id;

  const load = useCallback(async () => {
    setLoading(true);
    try {
      const m = await fetch(`${config.supabaseUrl}/rest/v1/matches?select=*&order=kickoff_utc.asc`, {
        headers: { 'apikey': config.supabaseKey, 'Authorization': `Bearer ${session.access_token}` }
      }).then(r=>r.json());

      const p = await fetch(`${config.supabaseUrl}/rest/v1/predictions?select=*&user_id=eq.${userId}`, {
        headers: { 'apikey': config.supabaseKey, 'Authorization': `Bearer ${session.access_token}` }
      }).then(r=>r.json());

      const predMap = {};
      if (Array.isArray(p)) p.forEach(x => predMap[x.match_id] = x);
      setPredictions(predMap);

      if (Array.isArray(m) && m.length > 0) {
        setMatches(m);
      } else {
        // Fallback: fetch from openfootball directly (read-only, not saved to DB)
        const ofb = await fetchOFBData();
        if (ofb) {
          setMatches(parseOFBMatches(ofb));
        }
      }
    } catch(e) { console.error(e); }
    setLoading(false);
  }, [supabase, userId, config, session]);

  useEffect(() => { load(); }, [load]);

  const groups = ['ALL', ...new Set((matches.map(m=>m.group_name||m.stage)).filter(Boolean))].slice(0,15);
  const filtered = filterGroup === 'ALL' ? matches : matches.filter(m=>(m.group_name||m.stage)===filterGroup);

  if (loading) return <div className="loading"><div className="spinner"/><p>Cargando partidos...</p></div>;

  return (
    <div>
      <div className="section-title">PARTIDOS</div>
      <div className="section-sub">Tocá un partido para cargar tu predicción</div>

      <div className="group-filter">
        {groups.map(g => (
          <button key={g} className={`group-btn ${filterGroup===g?'active':''}`} onClick={()=>setFilterGroup(g)}>
            {g === 'ALL' ? 'Todos' : g}
          </button>
        ))}
      </div>

      {filtered.length === 0 && (
        <div className="empty">
          <p>No hay partidos cargados aún.</p>
          {session?.user?.email === config.adminEmail && <p style={{marginTop:8,fontSize:12}}>Usá el panel Admin para cargar partidos.</p>}
        </div>
      )}

      {filtered.map(m => {
        const pred = predictions[m.id];
        const locked = isLocked(m.kickoff_utc);
        const hasResult = m.home_goals !== null && m.away_goals !== null;
        const pts = pred ? calcPoints(pred.home_goals, pred.away_goals, m.home_goals, m.away_goals) : null;
        const home = getTeam(m.home_team);
        const away = getTeam(m.away_team);
        const countdown = !locked ? timeUntilLock(m.kickoff_utc) : null;

        return (
          <div
            key={m.id}
            className={`match-card ${locked?'locked':''} ${hasResult?'has-result':''}`}
            onClick={() => !locked && setSelected(m)}
          >
            <div className="match-top">
              <div className="match-meta">
                <span className={`badge ${m.stage==='group'||m.group_name?'badge-group':'badge-ko'}`}>
                  {m.group_name || m.stage || 'Partido'}
                </span>
                {locked && <span className="badge badge-locked">🔒 Cerrado</span>}
                {!locked && countdown && <span className="badge badge-open">⏱ {countdown}</span>}
                {hasResult && <span className="badge badge-done">✓ Finalizado</span>}
              </div>
              <span className="match-date">{formatDate(m.kickoff_utc)}</span>
            </div>

            <div className="match-teams">
              <div className="team">
                <span className="team-flag">{home.flag}</span>
                <span className="team-name">{home.name}</span>
              </div>
              <div className="match-vs">
                {hasResult
                  ? <div className="score-real">{m.home_goals} - {m.away_goals}</div>
                  : <div className="vs-text">VS</div>
                }
              </div>
              <div className="team away">
                <span className="team-flag">{away.flag}</span>
                <span className="team-name">{away.name}</span>
              </div>
            </div>

            {pred && (
              <div className="prediction-row">
                <span className="pred-label">Tu predicción:</span>
                <div className="pred-value">
                  <span className="pred-score">{pred.home_goals} - {pred.away_goals}</span>
                  {pts !== null && (
                    <span className={`pts-badge pts-${pts}`}>
                      {pts === 3 ? '⭐ 3 pts' : pts === 1 ? '✓ 1 pt' : '✗ 0 pts'}
                    </span>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      })}

      {selected && (
        <PredModal
          match={selected}
          existing={predictions[selected.id]}
          session={session}
          config={config}
          onClose={() => setSelected(null)}
          onSave={(pred) => {
            setPredictions(p => ({...p, [selected.id]: pred}));
            setSelected(null);
          }}
        />
      )}
    </div>
  );
}

      onSave(Array.isArray(data) ? data[0] : data);
    } catch(e) { console.error(e); }
    setLoading(false);
  };

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-title">TU PREDICCIÓN</div>
        <div className="modal-teams">
          <div className="modal-team">
            <div className="modal-team-flag">{home.flag}</div>
            <div className="modal-team-name">{home.name}</div>
          </div>
          <div style={{color:'var(--gray)',fontSize:13}}>VS</div>
          <div className="modal-team">
            <div className="modal-team-flag">{away.flag}</div>
            <div className="modal-team-name">{away.name}</div>
          </div>
        </div>
        <div className="score-inputs">
          <div className="score-input-wrap">
            <span className="score-input-label">{home.name.split(' ')[0]}</span>
            <input className="score-input" type="number" min="0" max="20"
              value={homeG} onChange={e=>setHomeG(e.target.value)} />
          </div>
          <div className="score-dash">—</div>
          <div className="score-input-wrap">
            <span className="score-input-label">{away.name.split(' ')[0]}</span>
            <input className="score-input" type="number" min="0" max="20"
              value={awayG} onChange={e=>setAwayG(e.target.value)} />
          </div>
        </div>
        <div style={{fontSize:12,color:'var(--gray)',textAlign:'center',marginBottom:20}}>
          ⭐ 3 pts si acertás el resultado exacto · ✓ 1 pt si acertás quién gana/empata
        </div>
        <div className="modal-actions">
          <button className="btn-cancel" onClick={onClose}>Cancelar</button>
          <button className="btn-save" onClick={save} disabled={loading||homeG===''||awayG===''}>
            {loading ? 'Guardando...' : existing ? 'Actualizar' : 'Guardar'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// MI PRODE TAB
// ============================================================
function MiPredeTab({ supabase, session, config }) {
  const [matches, setMatches] = useState([]);
  const [predictions, setPredictions] = useState({});
  const [podiumPick, setPodiumPick] = useState(null);
  const [podiumForm, setPodiumForm] = useState({first:'',second:'',third:''});
  const [loading, setLoading] = useState(true);
  const [savingPodium, setSavingPodium] = useState(false);
  const [podiumMsg, setPodiumMsg] = useState('');
  const userId = session?.user?.id;

  const firstMatchKickoff = matches.length > 0 ? matches[0].kickoff_utc : null;
  const podiumLocked = firstMatchKickoff ? isLocked(firstMatchKickoff) : false;

  useEffect(() => {
    const load = async () => {
      setLoading(true);
      try {
        const [m, p, pod] = await Promise.all([
          fetch(`${config.supabaseUrl}/rest/v1/matches?select=*&order=kickoff_utc.asc`, {
            headers: { 'apikey': config.supabaseKey, 'Authorization': `Bearer ${session.access_token}` }
          }).then(r=>r.json()),
          fetch(`${config.supabaseUrl}/rest/v1/predictions?select=*&user_id=eq.${userId}`, {
            headers: { 'apikey': config.supabaseKey, 'Authorization': `Bearer ${session.access_token}` }
          }).then(r=>r.json()),
          fetch(`${config.supabaseUrl}/rest/v1/podium_picks?select=*&user_id=eq.${userId}`, {
            headers: { 'apikey': config.supabaseKey, 'Authorization': `Bearer ${session.access_token}` }
          }).then(r=>r.json()),
        ]);
        setMatches(Array.isArray(m) ? m : []);
        const predMap = {};
        if (Array.isArray(p)) p.forEach(x => predMap[x.match_id] = x);
        setPredictions(predMap);
        if (Array.isArray(pod) && pod.length > 0) {
          setPodiumPick(pod[0]);
          setPodiumForm({ first: pod[0].first_team, second: pod[0].second_team, third: pod[0].third_team });
        }
      } catch(e) { console.error(e); }
      setLoading(false);
    };
    load();
  }, [userId, config, session]);

  const savePodium = async () => {
    if (!podiumForm.first || !podiumForm.second || !podiumForm.third) return;
    if (podiumForm.first===podiumForm.second || podiumForm.first===podiumForm.third || podiumForm.second===podiumForm.third) {
      setPodiumMsg('Elegí 3 equipos distintos'); return;
    }
    setSavingPodium(true); setPodiumMsg('');
    const body = { user_id: userId, first_team: podiumForm.first, second_team: podiumForm.second, third_team: podiumForm.third };
    try {
      const r = await fetch(`${config.supabaseUrl}/rest/v1/podium_picks`, {
        method: 'POST',
        headers: {
          'apikey': config.supabaseKey, 'Authorization': `Bearer ${session.access_token}`,
          'Content-Type': 'application/json', 'Prefer': 'return=representation,resolution=merge-duplicates'
        },
        body: JSON.stringify(body)
      });
      const data = await r.json();
      setPodiumPick(Array.isArray(data) ? data[0] : data);
      setPodiumMsg('¡Podio guardado!');
    } catch(e) { setPodiumMsg('Error al guardar'); }
    setSavingPodium(false);
  };

  const totalPts = Object.values(predictions).reduce((acc, pred) => {
    const m = matches.find(x=>x.id===pred.match_id);
    if (!m) return acc;
    const pts = calcPoints(pred.home_goals, pred.away_goals, m.home_goals, m.away_goals);
    return acc + (pts||0);
  }, 0);

  const exactCount = Object.values(predictions).filter(pred => {
    const m = matches.find(x=>x.id===pred.match_id);
    return m && calcPoints(pred.home_goals, pred.away_goals, m.home_goals, m.away_goals) === 3;
  }).length;

  const predCount = Object.keys(predictions).length;

  if (loading) return <div className="loading"><div className="spinner"/><p>Cargando...</p></div>;

  return (
    <div>
      <div className="section-title">MI PRODE</div>
      <div className="section-sub">Tu resumen personal</div>

      <div className="stats-row">
        <div className="stat-card">
          <div className="stat-val">{totalPts}</div>
          <div className="stat-label">Puntos</div>
        </div>
        <div className="stat-card">
          <div className="stat-val">{predCount}</div>
          <div className="stat-label">Predicciones</div>
        </div>
        <div className="stat-card">
          <div className="stat-val">{exactCount}</div>
          <div className="stat-label">Exactas ⭐</div>
        </div>
      </div>

      {/* PODIO */}
      <div className="podio-card">
        <div className="podio-title">🏆 PREDICCIÓN DE PODIO</div>
        <div className="podio-sub">
          {podiumLocked
            ? '⛔ El torneo ya comenzó. No podés modificar el podio.'
            : 'Elegí campeón, segundo y tercer puesto antes del primer partido. 7 pts / 4 pts / 2 pts.'
          }
        </div>

        {['first','second','third'].map((pos, i) => {
          const labels = ['🥇 Campeón (+7 pts)','🥈 2do puesto (+4 pts)','🥉 3er puesto (+2 pts)'];
          const current = podiumForm[pos] ? getTeam(podiumForm[pos]) : null;
          return (
            <div className="podio-row" key={pos}>
              <span className="podio-label">{labels[i]}</span>
              {podiumLocked && podiumPick ? (
                <span style={{fontSize:15}}>
                  {current ? `${current.flag} ${current.name}` : '—'}
                </span>
              ) : (
                <select
                  className="podio-select"
                  value={podiumForm[pos]}
                  onChange={e=>setPodiumForm(f=>({...f,[pos]:e.target.value}))}
                  disabled={podiumLocked}
                >
                  <option value="">Elegir equipo...</option>
                  {Object.entries(TEAMS_BY_GROUP).map(([grp, teams]) => (
                    <optgroup key={grp} label={grp}>
                      {teams.map(t => (
                        <option key={t.id} value={t.id}>{t.flag} {t.name}</option>
                      ))}
                    </optgroup>
                  ))}
                </select>
              )}
            </div>
          );
        })}

        {!podiumLocked && (
          <>
            {podiumMsg && <div className={podiumMsg.includes('Error')||podiumMsg.includes('Elegí')?'msg-error':'msg-success'} style={{marginTop:12}}>{podiumMsg}</div>}
            <button className="btn-podio-save" onClick={savePodium} disabled={savingPodium}>
              {savingPodium ? 'Guardando...' : podiumPick ? 'Actualizar podio' : 'Guardar podio'}
            </button>
          </>
        )}
      </div>

      {/* PREDICTIONS LIST */}
      <div className="section-title" style={{fontSize:18,marginTop:8}}>MIS PREDICCIONES</div>
      <div className="section-sub">{predCount} predicciones cargadas</div>

      {matches.filter(m=>predictions[m.id]).map(m => {
        const pred = predictions[m.id];
        const pts = calcPoints(pred.home_goals, pred.away_goals, m.home_goals, m.away_goals);
        const home = getTeam(m.home_team); const away = getTeam(m.away_team);
        const hasResult = m.home_goals !== null && m.away_goals !== null;
        return (
          <div key={m.id} className={`match-card has-result`}>
            <div className="match-top">
              <span className="badge badge-group">{m.group_name||m.stage}</span>
              <span className="match-date">{formatDate(m.kickoff_utc)}</span>
            </div>
            <div className="match-teams">
              <div className="team"><span className="team-flag">{home.flag}</span><span className="team-name">{home.name}</span></div>
              <div className="match-vs">
                {hasResult
                  ? <div className="score-real">{m.home_goals} - {m.away_goals}</div>
                  : <div className="vs-text">VS</div>}
              </div>
              <div className="team away"><span className="team-flag">{away.flag}</span><span className="team-name">{away.name}</span></div>
            </div>
            <div className="prediction-row">
              <span className="pred-label">Tu predicción: <strong style={{color:'var(--white)'}}>{pred.home_goals} - {pred.away_goals}</strong></span>
              <div className="pred-value">
                {pts !== null
                  ? <span className={`pts-badge pts-${pts}`}>{pts===3?'⭐ 3 pts':pts===1?'✓ 1 pt':'✗ 0 pts'}</span>
                  : <span style={{fontSize:12,color:'var(--gray)'}}>Pendiente</span>
                }
              </div>
            </div>
          </div>
        );
      })}

      {predCount === 0 && (
        <div className="empty">
          <p>Todavía no cargaste predicciones.</p>
          <p style={{marginTop:8,fontSize:12}}>Andá a "Partidos" y tocá cualquier match para predecir.</p>
        </div>
      )}
    </div>
  );
}

// TABLA TAB
// ============================================================
function TablaTab({ supabase, session, config }) {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const userId = session?.user?.id;

  useEffect(() => {
    const load = async () => {
      setLoading(true);
      try {
        const [profiles, matches, allPreds, podiums] = await Promise.all([
          fetch(`${config.supabaseUrl}/rest/v1/profiles?select=*`, {
            headers: { 'apikey': config.supabaseKey, 'Authorization': `Bearer ${session.access_token}` }
          }).then(r=>r.json()),
          fetch(`${config.supabaseUrl}/rest/v1/matches?select=*`, {
            headers: { 'apikey': config.supabaseKey, 'Authorization': `Bearer ${session.access_token}` }
          }).then(r=>r.json()),
          fetch(`${config.supabaseUrl}/rest/v1/predictions?select=*`, {
            headers: { 'apikey': config.supabaseKey, 'Authorization': `Bearer ${session.access_token}` }
          }).then(r=>r.json()),
          fetch(`${config.supabaseUrl}/rest/v1/podium_picks?select=*`, {
            headers: { 'apikey': config.supabaseKey, 'Authorization': `Bearer ${session.access_token}` }
          }).then(r=>r.json()),
        ]);

        // Calculate actual podium winners from results
        // (simplified: we'd need final match data, for now skip podium pts calc in demo)
        const matchMap = {};
        if (Array.isArray(matches)) matches.forEach(m => matchMap[m.id]=m);

        const leaderboard = (Array.isArray(profiles)?profiles:[]).map(profile => {
          const userPreds = (Array.isArray(allPreds)?allPreds:[]).filter(p=>p.user_id===profile.id);
          let pts = 0, exact = 0, correct = 0;
          userPreds.forEach(pred => {
            const m = matchMap[pred.match_id];
            if (!m) return;
            const p = calcPoints(pred.home_goals, pred.away_goals, m.home_goals, m.away_goals);
            if (p === 3) { pts += 3; exact++; correct++; }
            else if (p === 1) { pts += 1; correct++; }
          });
          return { ...profile, pts, exact, correct, preds: userPreds.length };
        }).sort((a,b) => b.pts - a.pts || b.exact - a.exact);

        setRows(leaderboard);
      } catch(e) { console.error(e); }
      setLoading(false);
    };
    load();
  }, [config, session]);

  if (loading) return <div className="loading"><div className="spinner"/><p>Calculando posiciones...</p></div>;

  return (
    <div>
      <div className="section-title">TABLA DE POSICIONES</div>
      <div className="section-sub">Ranking general · actualizado en tiempo real</div>

      {rows.length === 0 && <div className="empty">Todavía no hay participantes registrados.</div>}

      <div className="leaderboard">
        {rows.map((r, i) => {
          const isMe = r.id === userId;
          const posClass = i===0?'top1':i===1?'top2':i===2?'top3':'';
          return (
            <div key={r.id} className={`lb-row ${isMe?'me':''}`}>
              <div className={`lb-pos ${posClass}`}>{i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div>
              <div className={`lb-name ${isMe?'me-name':''}`}>
                {r.display_name || r.email?.split('@')[0]}
                {isMe && <span style={{fontSize:11,color:'var(--gray)',marginLeft:6}}>(vos)</span>}
              </div>
              <div className="lb-detail">
                <div>{r.preds} pred.</div>
                <div>{r.exact}⭐</div>
              </div>
              <div className="lb-pts">
                {r.pts}
                <div className="lb-pts-label">pts</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ============================================================
// ADMIN TAB
// ============================================================
function AdminTab({ supabase, session, config, onConfigUpdate }) {
  const [tab, setTab] = useState('matches');
  const [matches, setMatches] = useState([]);
  const [loading, setLoading] = useState(false);
  const [wcStatus, setWcStatus] = useState('');
  const [editMatch, setEditMatch] = useState(null);

  useEffect(() => {
    fetch(`${config.supabaseUrl}/rest/v1/matches?select=*&order=kickoff_utc.asc`, {
      headers: { 'apikey': config.supabaseKey, 'Authorization': `Bearer ${session.access_token}` }
    }).then(r=>r.json()).then(m => setMatches(Array.isArray(m)?m:[]));
  }, [config, session]);

  const syncFromOFB = async () => {
    setLoading(true); setWcStatus('Conectando a openfootball (GitHub)...');
    try {
      const data = await fetchOFBData();
      if (!data) { setWcStatus('❌ No se pudo conectar. Intentá de nuevo en unos segundos.'); setLoading(false); return; }
      const rows = parseOFBMatches(data);
      setWcStatus(`Guardando ${rows.length} partidos...`);
      let ok = 0;
      for (let i = 0; i < rows.length; i += 25) {
        const batch = rows.slice(i, i + 25);
        await fetch(`${config.supabaseUrl}/rest/v1/matches`, {
          method: 'POST',
          headers: {
            'apikey': config.supabaseKey, 'Authorization': `Bearer ${session.access_token}`,
            'Content-Type': 'application/json', 'Prefer': 'return=minimal,resolution=merge-duplicates'
          },
          body: JSON.stringify(batch)
        });
        ok += batch.length;
        setWcStatus(`Guardando... ${ok}/${rows.length} partidos`);
      }
      setWcStatus(`✅ ${ok} partidos sincronizados desde openfootball`);
      const updated = await fetch(`${config.supabaseUrl}/rest/v1/matches?select=*&order=kickoff_utc.asc`, {
        headers: { 'apikey': config.supabaseKey, 'Authorization': `Bearer ${session.access_token}` }
      }).then(r=>r.json());
      setMatches(Array.isArray(updated)?updated:[]);
    } catch(e) { setWcStatus('❌ Error: ' + (e.message||'desconocido')); }
    setLoading(false);
  };

  const saveResult = async (matchId, homeG, awayG) => {
    await fetch(`${config.supabaseUrl}/rest/v1/matches?id=eq.${matchId}`, {
      method: 'PATCH',
      headers: {
        'apikey': config.supabaseKey, 'Authorization': `Bearer ${session.access_token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ home_goals: parseInt(homeG), away_goals: parseInt(awayG) })
    });
    setMatches(prev => prev.map(m => m.id===matchId ? {...m, home_goals:parseInt(homeG), away_goals:parseInt(awayG)} : m));
    setEditMatch(null);
  };

  return (
    <div>
      <div className="section-title">PANEL ADMIN</div>
      <div className="section-sub">Solo visible para vos como administrador</div>

      <div className="config-card">
        <div className="config-title">👤 Tu email de administrador</div>
        <div className="config-desc">Guardá tu email para acceder al panel Admin desde cualquier dispositivo.</div>
        <div style={{display:'flex',gap:10}}>
          <input className="config-input" style={{flex:1,background:'rgba(10,31,14,0.6)',border:'1px solid rgba(76,175,80,0.2)',borderRadius:10,padding:'10px 14px',color:'var(--white)',fontFamily:"'DM Sans',sans-serif",outline:'none'}}
            defaultValue={config.adminEmail || session.user?.email}
            onBlur={e => onCfgUpdate({...config, adminEmail: e.target.value})}
            placeholder="tu@email.com"
          />
        </div>
        <p style={{fontSize:11,color:'var(--gray)',marginTop:8}}>Actual: <strong style={{color:'var(--green-bright)'}}>{config.adminEmail || '(no configurado)'}</strong></p>
      </div>
        <div className="config-desc">
          Trae el fixture completo del Mundial 2026 (104 partidos) desde GitHub, <strong style={{color:'var(--green-bright)'}}>sin API key</strong>.
          También actualiza resultados apenas el repo los publica (normalmente en minutos).<br/>
          Fuente: <code style={{fontSize:11}}>raw.githubusercontent.com/openfootball/worldcup.json</code>
        </div>
        {wcStatus && <div className={wcStatus.startsWith('✅')?'msg-success':'msg-error'} style={{marginBottom:12}}>{wcStatus}</div>}
        <button className="btn-sm" onClick={syncFromOFB} disabled={loading}>
          {loading ? 'Sincronizando...' : '⬇ Sincronizar partidos y resultados'}
        </button>
      </div>

      <div className="config-card">
        <div className="config-title">✏️ Cargar resultado manualmente</div>
        <div className="config-desc">{matches.length} partidos en la base de datos</div>
        {matches.map(m => {
          const home = getTeam(m.home_team); const away = getTeam(m.away_team);
          const isEditing = editMatch === m.id;
          return (
            <div key={m.id} style={{display:'flex',alignItems:'center',gap:8,marginBottom:8,flexWrap:'wrap'}}>
              <span style={{flex:1,fontSize:13}}>
                {home.flag} {home.name} vs {away.flag} {away.name}
                <span style={{fontSize:11,color:'var(--gray)',marginLeft:6}}>{formatDate(m.kickoff_utc)}</span>
              </span>
              {isEditing ? (
                <ResultEditor
                  m={m}
                  onSave={saveResult}
                  onCancel={() => setEditMatch(null)}
                />
              ) : (
                <div style={{display:'flex',alignItems:'center',gap:6}}>
                  {m.home_goals !== null
                    ? <span style={{fontFamily:"'Bebas Neue'",color:'var(--gold)',fontSize:16}}>{m.home_goals} - {m.away_goals}</span>
                    : <span style={{fontSize:12,color:'var(--gray)'}}>Sin resultado</span>
                  }
                  <button className="btn-sm" style={{padding:'4px 10px',fontSize:11}} onClick={() => setEditMatch(m.id)}>
                    {m.home_goals !== null ? 'Editar' : '+ Resultado'}
                  </button>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ResultEditor({ m, onSave, onCancel }) {
  const [hg, setHg] = useState(m.home_goals ?? '');
  const [ag, setAg] = useState(m.away_goals ?? '');
  return (
    <div style={{display:'flex',gap:6,alignItems:'center'}}>
      <input className="score-input" style={{width:44,height:36,fontSize:18}} type="number" min="0"
        value={hg} onChange={e=>setHg(e.target.value)} />
      <span style={{color:'var(--gray)'}}>-</span>
      <input className="score-input" style={{width:44,height:36,fontSize:18}} type="number" min="0"
        value={ag} onChange={e=>setAg(e.target.value)} />
      <button className="btn-sm" style={{padding:'4px 10px',fontSize:11}} onClick={() => onSave(m.id,hg,ag)}>✓</button>
      <button className="btn-cancel" style={{padding:'4px 10px',fontSize:11}} onClick={onCancel}>✗</button>
    </div>
  );
}
